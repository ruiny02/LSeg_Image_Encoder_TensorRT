version: "3.9"

services:
  lseg-x86:
    profiles: ["x86"]
    image: ruiny022/lseg-trt:x86-u22.04
    container_name: lseg-trt-x86
    runtime: nvidia
    privileged: true
    network_mode: host
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics

  lseg-jetson:
    profiles: ["jetson"]
    build:
      context: .
      dockerfile: Dockerfile.jetson
      args:
        BASE_IMAGE: nvcr.io/nvidia/l4t-jetpack:r36.4.0
    image: lseg-trt:jetson-jp61-local
    container_name: lseg-trt-jetson
    runtime: nvidia
    privileged: true
    network_mode: host
    volumes:
      - ./:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
